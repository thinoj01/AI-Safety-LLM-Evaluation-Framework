[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-eval"
version = "0.1.0"
description = "Exploratory LLM evaluation harness"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
safety-eval = "safety_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
